<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>JADWAL SAS - MI HIDAYATUL MUBTADIIN SUKORAME</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.js"></script>
<style>
*{box-sizing:border-box;font-family:Times New Roman,serif}
body{margin:0;padding:10px;background:#eee}
.top{background:#fff;width:210mm;margin:0 auto 12px;padding:14px;border-radius:12px;font-family:system-ui}
.top h2{font-family:system-ui;font-size:18px;margin:0;text-align:center}
.btn{padding:12px 18px;border:none;border-radius:8px;font-weight:800;cursor:pointer;font-family:system-ui}
.btn-green{background:#16a34a;color:#fff} .btn-dark{background:#111;color:#fff}
.page{background:#fff;width:210mm;min-height:297mm;margin:auto;padding:12mm 10mm}
.row{display:flex;gap:14px;margin-bottom:14px}
.jadwal{flex:1}
h3,h4{margin:0;text-align:center;line-height:1.4} h3{font-size:13px} h4{font-size:12px}
table{width:100%;border-collapse:collapse;margin-top:8px;font-size:11px}
th,td{border:1px solid #000;padding:5px;vertical-align:middle;text-align:left}
th{background:#ddd;text-align:center}
td:nth-child(1){text-align:center;width:28px;font-weight:bold}
td:nth-child(2){text-align:center;font-weight:bold;line-height:1.3}
td:nth-child(3){text-align:center;white-space:nowrap}
.ttd{margin-top:12px;display:flex;justify-content:flex-end;font-size:11px;line-height:1.4}
.ttd .kanan{text-align:center;width:55%}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:10px}
.grid3 button{padding:11px;border:none;border-radius:8px;font-weight:800;cursor:pointer;font-size:13px;font-family:system-ui}
.pisah{border:1px solid #ddd;border-radius:12px;padding:12px;margin-bottom:12px;background:#fafafa;font-family:system-ui}
.pisah h3{font-family:system-ui;text-align:left;font-size:16px}
#status{font-family:system-ui;font-size:12px;text-align:center;margin-top:8px;color:#dc2626}
@media print{ body{background:#fff;padding:0} .top{display:none!important} .page{width:auto;min-height:auto;padding:8mm;margin:0} .row{page-break-inside:avoid} }
</style></head>
<body>

<div class="top">
<h2>JADWAL SUMATIF AKHIR SEMESTER (SAS)<br>MI HIDAYATUL MUBTADIIN SUKORAME<br>TAHUN PELAJARAN 2026/2027</h2>
<div style="display:flex;gap:6px;margin-top:12px;justify-content:center;flex-wrap:wrap">
<button class="btn btn-green" onclick="window.print()">PRINT</button>
<button class="btn btn-dark" onclick="downloadSemuaExcel()">DOWNLOAD SEMUA EXCEL</button>
</div>
<div id="status"></div>
<div id="listPisah" style="margin-top:14px"></div>
</div>

<div class="page" id="isi"></div>

<script>
let NAMA_SEKOLAH='MI HIDAYATUL MUBTADIIN SUKORAME';
let JUDUL='JADWAL SUMATIF AKHIR SEMESTER (SAS)';
let TA='TAHUN PELAJARAN 2026/2027';
let KEPALA='MUH. ABARIQA, S.S';
let TGL_TTD='Sukorame, 24 November 2026';

let base=[
['1','SENIN<br>30 November 2026','07.00 - 08.30','BAHASA JAWA'],
['1','SENIN<br>30 November 2026','09.00 - 10.30','ASWAJA / KE-NU-AN'],
['2','SELASA<br>01 Desember 2026','07.00 - 08.30','BAHASA INDONESIA'],
['2','SELASA<br>01 Desember 2026','09.00 - 10.30',"AL-QUR'AN HADITS"],
['3','RABU<br>02 Desember 2026','07.00 - 08.30','PEND. PANCASILA'],
['3','RABU<br>02 Desember 2026','09.00 - 10.30','AKIDAH AKHLAK'],
['4','KAMIS<br>03 Desember 2026','07.00 - 09.00','MATEMATIKA'],
['4','KAMIS<br>03 Desember 2026','09.30 - 11.00','FIQIH'],
['5','JUMAT<br>04 Desember 2026','07.00 - 08.30','SENI DAN BUDAYA'],
['5','JUMAT<br>04 Desember 2026','09.00 - 10.30','BAHASA ARAB'],
['6','SABTU<br>05 Desember 2026','07.00 - 08.30','PJOK'],
['6','SABTU<br>05 Desember 2026','09.00 - 10.30','BAHASA INGGRIS'],
];
let tambahan=[
['7','SENIN<br>07 Desember 2026','07.00 - 08.30','IPAS'],
['7','SENIN<br>07 Desember 2026','09.00 - 10.30','SKI'],
];
let data=[];
for(let k=1;k<=6;k++){
  let romawi=['','I','II','III','IV','V','VI'][k];
  let rows=[...base];
  if(k>=3) rows=[...base, ...tambahan];
  data.push({kelas:'KELAS '+romawi, rows:rows, jml:rows.length});
}

function buatJadwal(d, withTTD){
  let html=`<div class="jadwal"><h3>${JUDUL}</h3><h4>${TA}</h4><h4>${NAMA_SEKOLAH}</h4><h4>${d.kelas}</h4><table><tr><th>NO</th><th>HARI/TANGGAL</th><th>WAKTU</th><th>MATA PELAJARAN</th></tr>`;
  let i=0;
  while(i<d.rows.length){
    let j=i;
    while(j<d.rows.length && d.rows[j][0]===d.rows[i][0] && d.rows[j][1]===d.rows[i][1]) j++;
    let rowspan=j-i;
    for(let k=i;k<j;k++){
      html+=`<tr>`;
      if(k===i) html+=`<td rowspan="${rowspan}">${d.rows[k][0]}</td><td rowspan="${rowspan}">${d.rows[k][1]}</td>`;
      html+=`<td>${d.rows[k][2]}</td><td>${d.rows[k][3]}</td></tr>`;
    }
    i=j;
  }
  html+=`</table>`;
  if(withTTD){
    html+=`<div class="ttd"><div class="kanan">${TGL_TTD}<br>Kepala Madrasah<br><br><br><br><b><u>${KEPALA}</u></b></div></div>`;
  }
  html+=`</div>`; return html;
}
function render(){
  let out='';
  for(let i=0;i<data.length;i+=2){
    out+=`<div class="row">${buatJadwal(data[i],true)}${data[i+1]?buatJadwal(data[i+1],true):'<div class="jadwal"></div>'}</div>`;
    if(i===1) out+=`<div style="page-break-after:always"></div>`;
  }
  document.getElementById('isi').innerHTML=out;
  let pisah='';
  data.forEach(d=>{
    pisah+=`<div class="pisah"><h3>${d.kelas}</h3><div class="grid3"><button style="background:#16a34a;color:#fff" onclick="downloadExcelSatu('${d.kelas}')">EXCEL</button><button style="background:#0d9488;color:#fff" onclick="downloadWordSatu('${d.kelas}')">WORD</button><button style="background:#2563eb;color:#fff" onclick="downloadPDFSatu('${d.kelas}')">PDF</button></div></div>`;
  });
  document.getElementById('listPisah').innerHTML=pisah;
}
function ambilKelas(nama){ return data.find(d=>d.kelas===nama); }
function setStatus(t){ document.getElementById('status').innerHTML=t; }

// ===== EXCEL - 2 TABEL JEJER, PODo PDF =====
// Layout kolom: A-D = tabel kiwo, E = pemisah, F-I = tabel tengen
function isiSatuTabelExcel(ws, d, colStart){
  let thin={top:{style:'thin'},left:{style:'thin'},bottom:{style:'thin'},right:{style:'thin'}};
  let judul=['JADWAL SUMATIF AKHIR SEMESTER (SAS)','TAHUN PELAJARAN 2026/2027','MI HIDAYATUL MUBTADIIN SUKORAME',d.kelas];
  judul.forEach((t,i)=>{
    ws.mergeCells(i+1,colStart,i+1,colStart+3);
    let c=ws.getCell(i+1,colStart);
    c.value=t; c.font={bold:true,size:11,name:'Times New Roman'};
    c.alignment={horizontal:'center',vertical:'middle'};
    c.border=thin;
  });
  let hr=ws.getRow(5);
  ['NO','HARI/TANGGAL','WAKTU','MATA PELAJARAN'].forEach((h,ci)=>{
    let c=hr.getCell(colStart+ci);
    c.value=h; c.font={bold:true,size:10,name:'Times New Roman'};
    c.alignment={horizontal:'center',vertical:'middle'};
    c.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFDDDDDD'}};
    c.border=thin;
  });
  let rowIdx=6, i=0;
  while(i<d.rows.length){
    let j=i; while(j<d.rows.length && d.rows[j][0]===d.rows[i][0]) j++;
    let rowspan=j-i;
    if(rowspan>1) ws.mergeCells(rowIdx,colStart,rowIdx+rowspan-1,colStart);
    let cNo=ws.getCell(rowIdx,colStart);
    cNo.value=parseInt(d.rows[i][0]); cNo.font={bold:true,size:10,name:'Times New Roman'}; cNo.alignment={horizontal:'center',vertical:'middle'};
    if(rowspan>1) ws.mergeCells(rowIdx,colStart+1,rowIdx+rowspan-1,colStart+1);
    let cHari=ws.getCell(rowIdx,colStart+1);
    cHari.value=d.rows[i][1].replace('<br>','\n').toUpperCase(); cHari.font={bold:true,size:10,name:'Times New Roman'}; cHari.alignment={horizontal:'center',vertical:'middle',wrapText:true};
    for(let k=i;k<j;k++){
      let r=ws.getRow(rowIdx+(k-i));
      let cw=r.getCell(colStart+2); cw.value=d.rows[k][2]; cw.font={size:10,name:'Times New Roman'}; cw.alignment={horizontal:'center',vertical:'middle'};
      let cm=r.getCell(colStart+3); cm.value=d.rows[k][3]; cm.font={size:10,name:'Times New Roman'}; cm.alignment={horizontal:'left',vertical:'middle'};
      r.height=22;
    }
    for(let rr=rowIdx; rr<rowIdx+rowspan; rr++){ for(let cc=colStart; cc<colStart+4; cc++){ ws.getCell(rr,cc).border=thin; } }
    rowIdx+=rowspan; i=j;
  }
  // TTD hanya Kamad, tanpa kotak, tanpa garis
  rowIdx++;
  ws.mergeCells(rowIdx,colStart+2,rowIdx,colStart+3);
  let cTgl=ws.getCell(rowIdx,colStart+2); cTgl.value='Sukorame, 24 November 2026'; cTgl.font={size:10,name:'Times New Roman'}; cTgl.alignment={horizontal:'center'};
  rowIdx++;
  ws.mergeCells(rowIdx,colStart+2,rowIdx,colStart+3);
  let cJab=ws.getCell(rowIdx,colStart+2); cJab.value='Kepala Madrasah'; cJab.font={size:10,name:'Times New Roman'}; cJab.alignment={horizontal:'center'};
  rowIdx++;
  for(let b=0;b<3;b++){ rowIdx++; }
  ws.mergeCells(rowIdx,colStart+2,rowIdx,colStart+3);
  let cNama=ws.getCell(rowIdx,colStart+2); cNama.value='MUH. ABARIQA, S.S'; cNama.font={bold:true,size:10,name:'Times New Roman'}; cNama.alignment={horizontal:'center'};
  return rowIdx;
}
async function buatSheetExcel2Kolom(workbook, d){
  let ws=workbook.addWorksheet(d.kelas);
  // A-D kiwo, E pemisah, F-I tengen
  ws.columns=[{width:7},{width:26},{width:16},{width:22},{width:3},{width:7},{width:26},{width:16},{width:22}];
  isiSatuTabelExcel(ws,d,1);
  isiSatuTabelExcel(ws,d,6);
  ws.sheetProperties.pageSetUpPr={fitToPage:true};
  ws.pageSetup={paperSize:9, orientation:'landscape', fitToWidth:1, fitToHeight:1, paperSize:9};
  ws.printOptions={horizontalCentered:true};
  return ws;
}
function downloadExcelCadangan2Kolom(nama, semua){
  // Cadangan SheetJS - 2 tabel jejer
  let wb=XLSX.utils.book_new();
  let daftar=semua?data:[ambilKelas(nama)];
  daftar.forEach(d=>{
    let aoa=[];
    let merges=[];
    let judul=['JADWAL SUMATIF AKHIR SEMESTER (SAS)','TAHUN PELAJARAN 2026/2027','MI HIDAYATUL MUBTADIIN SUKORAME',d.kelas];
    judul.forEach((t,i)=>{ let row=new Array(9).fill(''); row[0]=t; row[5]=t; aoa.push(row); merges.push({s:{r:i,c:0},e:{r:i,c:3}}); merges.push({s:{r:i,c:5},e:{r:i,c:8}}); });
    let header=new Array(9).fill(''); header[0]='NO'; header[1]='HARI/TANGGAL'; header[2]='WAKTU'; header[3]='MATA PELAJARAN'; header[5]='NO'; header[6]='HARI/TANGGAL'; header[7]='WAKTU'; header[8]='MATA PELAJARAN'; aoa.push(header);
    let rIdx=5, i=0;
    while(i<d.rows.length){
      let j=i; while(j<d.rows.length && d.rows[j][0]===d.rows[i][0]) j++;
      let rowspan=j-i;
      if(rowspan>1){ merges.push({s:{r:rIdx,c:0},e:{r:rIdx+rowspan-1,c:0}}); merges.push({s:{r:rIdx,c:1},e:{r:rIdx+rowspan-1,c:1}}); merges.push({s:{r:rIdx,c:5},e:{r:rIdx+rowspan-1,c:5}}); merges.push({s:{r:rIdx,c:6},e:{r:rIdx+rowspan-1,c:6}}); }
      for(let k=i;k<j;k++){
        let row=new Array(9).fill('');
        row[0]=k===i?d.rows[k][0]:''; row[1]=k===i?d.rows[k][1].replace('<br>',', ').toUpperCase():''; row[2]=d.rows[k][2]; row[3]=d.rows[k][3];
        row[5]=k===i?d.rows[k][0]:''; row[6]=k===i?d.rows[k][1].replace('<br>',', ').toUpperCase():''; row[7]=d.rows[k][2]; row[8]=d.rows[k][3];
        aoa.push(row);
      }
      rIdx+=rowspan; i=j;
    }
    aoa.push(new Array(9).fill(''));
    let t1=new Array(9).fill(''); t1[2]='Sukorame, 24 November 2026'; t1[7]='Sukorame, 24 November 2026'; aoa.push(t1);
    let t2=new Array(9).fill(''); t2[2]='Kepala Madrasah'; t2[7]='Kepala Madrasah'; aoa.push(t2);
    aoa.push(new Array(9).fill('')); aoa.push(new Array(9).fill('')); aoa.push(new Array(9).fill(''));
    let t3=new Array(9).fill(''); t3[2]='MUH. ABARIQA, S.S'; t3[7]='MUH. ABARIQA, S.S'; aoa.push(t3);
    let ws=XLSX.utils.aoa_to_sheet(aoa);
    ws['!merges']=merges; ws['!cols']=[{wch:7},{wch:26},{wch:16},{wch:22},{wch:3},{wch:7},{wch:26},{wch:16},{wch:22}];
    XLSX.utils.book_append_sheet(wb, ws, d.kelas);
  });
  XLSX.writeFile(wb, semua?'Jadwal-SAS-Per-Kelas-Hidayatul-Sukorame.xlsx':`Jadwal-SAS-${nama.replace(' ','-')}-Hidayatul-Sukorame.xlsx`);
}
async function downloadExcelSatu(nama){
  try{
    setStatus('⏳ Lagi nggawe Excel 2 kolom...');
    if(typeof ExcelJS!=='undefined'){
      let d=ambilKelas(nama);
      let wb=new ExcelJS.Workbook();
      await buatSheetExcel2Kolom(wb,d);
      let buf=await wb.xlsx.writeBuffer();
      let blob=new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
      let a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`Jadwal-SAS-${nama.replace(' ','-')}-Hidayatul-Sukorame.xlsx`; a.click();
      setStatus('✅ Excel ke-download - 2 tabel jejer');
    } else if(typeof XLSX!=='undefined'){ downloadExcelCadangan2Kolom(nama,false); setStatus('✅ Excel ke-download (cadangan)'); }
    else alert('Library Excel gagal ke-load. Coba refresh.');
  }catch(e){ console.log(e); if(typeof XLSX!=='undefined'){ downloadExcelCadangan2Kolom(nama,false); setStatus('✅ Excel ke-download (cadangan)'); } else alert('Gagal: '+e.message); }
}
async function downloadSemuaExcel(){
  try{
    if(typeof ExcelJS!=='undefined'){
      let wb=new ExcelJS.Workbook();
      for(let d of data){ await buatSheetExcel2Kolom(wb,d); }
      let buf=await wb.xlsx.writeBuffer();
      let blob=new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
      let a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='Jadwal-SAS-Per-Kelas-Hidayatul-Sukorame.xlsx'; a.click();
    } else downloadExcelCadangan2Kolom('',true);
  }catch(e){ downloadExcelCadangan2Kolom('',true); }
}

// ===== WORD - 2 TABEL JEJER, PODo PDF =====
// Cara Word: pakai tabel pembungkus 1 baris 2 kolom, neng jero tiap kolom ono tabel jadwal
function buatTabelJadwalDocx(d){
  let rows=[];
  let header=new docx.TableRow({children:['NO','HARI/TANGGAL','WAKTU','MATA PELAJARAN'].map(t=>new docx.TableCell({width:{size:25,type:docx.WidthType.PERCENTAGE}, children:[new docx.Paragraph({alignment:docx.AlignmentType.CENTER, children:[new docx.TextRun({text:t,bold:true,size:18})]})]}))});
  rows.push(header);
  let i=0;
  while(i<d.rows.length){
    let j=i; while(j<d.rows.length && d.rows[j][0]===d.rows[i][0]) j++;
    let rowspan=j-i;
    for(let k=i;k<j;k++){
      let cells=[];
      if(k===i) cells.push(new docx.TableCell({verticalMerge: rowspan>1?docx.VerticalMergeType.RESTART:undefined, children:[new docx.Paragraph({alignment:docx.AlignmentType.CENTER, children:[new docx.TextRun({text:d.rows[k][0],bold:true,size:18})]})]}));
      else cells.push(new docx.TableCell({verticalMerge: docx.VerticalMergeType.CONTINUE, children:[new docx.Paragraph({text:''})]}));
      if(k===i) cells.push(new docx.TableCell({verticalMerge: rowspan>1?docx.VerticalMergeType.RESTART:undefined, children:[new docx.Paragraph({alignment:docx.AlignmentType.CENTER, children:[new docx.TextRun({text:d.rows[k][1].replace('<br>',', ').toUpperCase(),bold:true,size:18})]})]}));
      else cells.push(new docx.TableCell({verticalMerge: docx.VerticalMergeType.CONTINUE, children:[new docx.Paragraph({text:''})]}));
      cells.push(new docx.TableCell({children:[new docx.Paragraph({alignment:docx.AlignmentType.CENTER, children:[new docx.TextRun({text:d.rows[k][2],size:18})]})]}));
      cells.push(new docx.TableCell({children:[new docx.Paragraph({children:[new docx.TextRun({text:d.rows[k][3],size:18})]})]}));
      rows.push(new docx.TableRow({children:cells}));
    }
    i=j;
  }
  return new docx.Table({rows:rows, width:{size:100,type:docx.WidthType.PERCENTAGE}, borders:{top:{style:docx.BorderStyle.SINGLE,size:6},left:{style:docx.BorderStyle.SINGLE,size:6},bottom:{style:docx.BorderStyle.SINGLE,size:6},right:{style:docx.BorderStyle.SINGLE,size:6},insideHorizontal:{style:docx.BorderStyle.SINGLE,size:6},insideVertical:{style:docx.BorderStyle.SINGLE,size:6}}});
}
function buatSatuKolomDocx(d){
  return [
    new docx.Paragraph({alignment:docx.AlignmentType.CENTER, children:[new docx.TextRun({text:'JADWAL SUMATIF AKHIR SEMESTER (SAS)',bold:true,size:20})]}),
    new docx.Paragraph({alignment:docx.AlignmentType.CENTER, children:[new docx.TextRun({text:'TAHUN PELAJARAN 2026/2027',bold:true,size:18})]}),
    new docx.Paragraph({alignment:docx.AlignmentType.CENTER, children:[new docx.TextRun({text:'MI HIDAYATUL MUBTADIIN SUKORAME',bold:true,size:18})]}),
    new docx.Paragraph({alignment:docx.AlignmentType.CENTER, children:[new docx.TextRun({text:d.kelas,bold:true,size:20})]}),
    new docx.Paragraph({text:''}),
    buatTabelJadwalDocx(d),
    new docx.Paragraph({text:''}),
    new docx.Paragraph({alignment:docx.AlignmentType.RIGHT, children:[new docx.TextRun({text:'Sukorame, 24 November 2026',size:18})]}),
    new docx.Paragraph({alignment:docx.AlignmentType.RIGHT, children:[new docx.TextRun({text:'Kepala Madrasah',size:18})]}),
    new docx.Paragraph({text:''}), new docx.Paragraph({text:''}), new docx.Paragraph({text:''}),
    new docx.Paragraph({alignment:docx.AlignmentType.RIGHT, children:[new docx.TextRun({text:'MUH. ABARIQA, S.S',bold:true,underline:{},size:18})]}),
  ];
}
function downloadWordCadangan2Kolom(nama){
  let d=ambilKelas(nama);
  let buatSatuHTML=()=>{
    let rowsHtml=''; let i=0;
    while(i<d.rows.length){
      let j=i; while(j<d.rows.length && d.rows[j][0]===d.rows[i][0]) j++;
      let rowspan=j-i;
      for(let k=i;k<j;k++){
        rowsHtml+='<tr>';
        if(k===i) rowsHtml+=`<td rowspan="${rowspan}" style="text-align:center;font-weight:bold">${d.rows[k][0]}</td><td rowspan="${rowspan}" style="text-align:center;font-weight:bold">${d.rows[k][1].replace('<br>',', ').toUpperCase()}</td>`;
        rowsHtml+=`<td style="text-align:center">${d.rows[k][2]}</td><td>${d.rows[k][3]}</td></tr>`;
      }
      i=j;
    }
    return `<div style="width:48%;display:inline-block;vertical-align:top;margin-right:2%"><h3 style="text-align:center;font-size:11px">JADWAL SUMATIF AKHIR SEMESTER (SAS)<br>TAHUN PELAJARAN 2026/2027<br>MI HIDAYATUL MUBTADIIN SUKORAME<br>${d.kelas}</h3><table style="border-collapse:collapse;width:100%"><tr><th>NO</th><th>HARI/TANGGAL</th><th>WAKTU</th><th>MATA PELAJARAN</th></tr>${rowsHtml}</table><div style="text-align:right;font-size:11px">Sukorame, 24 November 2026<br>Kepala Madrasah<br><br><br><br><b><u>MUH. ABARIQA, S.S</u></b></div></div>`;
  };
  let html=`<html><head><meta charset="utf-8"><style>table{border-collapse:collapse;width:100%}td,th{border:1px solid #000;padding:4px;font-family:'Times New Roman';font-size:10px}th{background:#ddd}</style></head><body>${buatSatuHTML()}${buatSatuHTML()}</body></html>`;
  let blob=new Blob(['\ufeff',html],{type:'application/msword'});
  let a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`Jadwal-SAS-${nama.replace(' ','-')}-Hidayatul-Sukorame.doc`; a.click();
}
async function downloadWordSatu(nama){
  try{
    setStatus('⏳ Lagi nggawe Word 2 kolom...');
    if(typeof docx!=='undefined' && docx.Document){
      let d=ambilKelas(nama);
      // Tabel pembungkus: 1 baris, 2 kolom, tiap kolom isi jadwal lengkap
      let outer=new docx.Table({
        rows:[new docx.TableRow({children:[
          new docx.TableCell({width:{size:50,type:docx.WidthType.PERCENTAGE}, children: buatSatuKolomDocx(d)}),
          new docx.TableCell({width:{size:50,type:docx.WidthType.PERCENTAGE}, children: buatSatuKolomDocx(d)}),
        ]})],
        width:{size:100,type:docx.WidthType.PERCENTAGE},
        borders:{top:{style:docx.BorderStyle.NONE,size:0},left:{style:docx.BorderStyle.NONE,size:0},bottom:{style:docx.BorderStyle.NONE,size:0},right:{style:docx.BorderStyle.NONE,size:0},insideHorizontal:{style:docx.BorderStyle.NONE,size:0},insideVertical:{style:docx.BorderStyle.NONE,size:0}}
      });
      let doc=new docx.Document({sections:[{properties:{page:{size:{orientation:docx.PageOrientation.LANDSCAPE}}}, children:[outer]}]});
      let blob=await docx.Packer.toBlob(doc);
      let a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`Jadwal-SAS-${nama.replace(' ','-')}-Hidayatul-Sukorame.docx`; a.click();
      setStatus('✅ Word ke-download - 2 tabel jejer');
    } else { downloadWordCadangan2Kolom(nama); setStatus('✅ Word ke-download (cadangan .doc)'); }
  }catch(e){ console.log(e); downloadWordCadangan2Kolom(nama); setStatus('✅ Word ke-download (cadangan .doc)'); }
}

// ===== PDF - 2 KOLOM JEJER, KIWO-TENGEN KELAS E PODO, HANYA KAMAD =====
function gambarSatuTabelPDF(doc, d, x0, yAwal){
  let wNo=10, wHari=42, wWaktu=28, wMapel=45, wTotal=wNo+wHari+wWaktu+wMapel;
  let y=yAwal, h=7;
  doc.setFont('times','bold'); doc.setFontSize(10);
  doc.text('JADWAL SUMATIF AKHIR SEMESTER (SAS)', x0+wTotal/2, y, {align:'center'}); y+=5;
  doc.text('TAHUN PELAJARAN 2026/2027', x0+wTotal/2, y, {align:'center'}); y+=5;
  doc.text('MI HIDAYATUL MUBTADIIN SUKORAME', x0+wTotal/2, y, {align:'center'}); y+=5;
  doc.text(d.kelas, x0+wTotal/2, y, {align:'center'}); y+=6;
  doc.setFillColor(221,221,221); doc.rect(x0,y,wTotal,h,'FD');
  doc.setFontSize(9); doc.text('NO', x0+wNo/2, y+5, {align:'center'});
  doc.text('HARI/TANGGAL', x0+wNo+wHari/2, y+5, {align:'center'});
  doc.text('WAKTU', x0+wNo+wHari+wWaktu/2, y+5, {align:'center'});
  doc.text('MATA PELAJARAN', x0+wNo+wHari+wWaktu+wMapel/2, y+5, {align:'center'});
  y+=h;
  doc.setFont('times','normal'); doc.setFontSize(9);
  let i=0;
  while(i<d.rows.length){
    let j=i; while(j<d.rows.length && d.rows[j][0]===d.rows[i][0]) j++;
    let rowspan=j-i;
    let yA=y;
    doc.rect(x0, yA, wNo, h*rowspan);
    doc.setFont('times','bold'); doc.text(d.rows[i][0], x0+wNo/2, yA+(h*rowspan)/2+1.5, {align:'center'});
    doc.rect(x0+wNo, yA, wHari, h*rowspan);
    let hariParts=d.rows[i][1].split('<br>');
    doc.text(hariParts[0].trim(), x0+wNo+wHari/2, yA+5, {align:'center'});
    if(hariParts[1]) doc.text(hariParts[1].trim(), x0+wNo+wHari/2, yA+10, {align:'center'});
    doc.setFont('times','normal');
    for(let k=i;k<j;k++){
      doc.rect(x0+wNo+wHari, y, wWaktu, h);
      doc.text(d.rows[k][2], x0+wNo+wHari+wWaktu/2, y+5, {align:'center'});
      doc.rect(x0+wNo+wHari+wWaktu, y, wMapel, h);
      doc.text(d.rows[k][3], x0+wNo+wHari+wWaktu+2, y+5);
      y+=h;
    }
    i=j;
  }
  y+=6; doc.setFont('times','normal');
  doc.text('Sukorame, 24 November 2026', x0+wTotal-2, y, {align:'right'}); y+=5;
  doc.text('Kepala Madrasah', x0+wTotal-2, y, {align:'right'}); y+=15;
  doc.setFont('times','bold'); doc.text('MUH. ABARIQA, S.S', x0+wTotal-2, y, {align:'right'});
  return y;
}
function downloadPDFSatu(nama){
  try{
    let { jsPDF } = window.jspdf; let d=ambilKelas(nama);
    let doc=new jsPDF({unit:'mm', format:'a4', orientation:'landscape'});
    gambarSatuTabelPDF(doc,d,10,12);
    gambarSatuTabelPDF(doc,d,152,12);
    doc.save(`Jadwal-SAS-${nama.replace(' ','-')}-Hidayatul-Sukorame.pdf`);
    setStatus('✅ PDF ke-download');
  }catch(e){ alert('PDF gagal: '+e.message); }
}
